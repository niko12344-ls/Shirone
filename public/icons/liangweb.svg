<svg xmlns="http://www.w3.org/2000/svg" width="88" height="31" viewBox="0 0 88 31">
  <!-- 背景（直角） -->
  <rect width="88" height="31" fill="#0D1117"/>

  <!-- Web 地球符号 -->
  <g transform="translate(13, 15.5)">
    <!-- 外圆 -->
    <circle cx="0" cy="0" r="9" fill="none" stroke="#58A6FF" stroke-width="1.3"/>

    <!-- 经线（竖弧） -->
    <ellipse cx="0" cy="0" rx="3.6" ry="9" fill="none" stroke="#58A6FF" stroke-width="0.9" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="6.7" ry="9" fill="none" stroke="#58A6FF" stroke-width="0.7" opacity="0.4"/>

    <!-- 纬线（横弧） -->
    <line x1="-8.5" y1="0" x2="8.5" y2="0" stroke="#58A6FF" stroke-width="0.9" opacity="0.7"/>
    <ellipse cx="0" cy="-4.5" rx="7.7" ry="2.5" fill="none" stroke="#58A6FF" stroke-width="0.7" opacity="0.5"/>
    <ellipse cx="0" cy="4.5" rx="7.7" ry="2.5" fill="none" stroke="#58A6FF" stroke-width="0.7" opacity="0.5"/>

    <!-- 节点（象征网络连接） -->
    <circle cx="-3.6" cy="-3.2" r="1.1" fill="#3FB950"/>
    <circle cx="4" cy="-5" r="1" fill="#3FB950"/>
    <circle cx="5.8" cy="2.7" r="1" fill="#3FB950"/>
    <circle cx="-5" cy="4" r="1" fill="#3FB950"/>
    <circle cx="0" cy="0" r="1.2" fill="#F0883E"/>

    <!-- 节点连接线 -->
    <line x1="-3.6" y1="-3.2" x2="4" y2="-5" stroke="#3FB950" stroke-width="0.5" opacity="0.7"/>
    <line x1="4" y1="-5" x2="5.8" y2="2.7" stroke="#3FB950" stroke-width="0.5" opacity="0.7"/>
    <line x1="5.8" y1="2.7" x2="-5" y2="4" stroke="#3FB950" stroke-width="0.5" opacity="0.7"/>
    <line x1="-5" y1="4" x2="-3.6" y2="-3.2" stroke="#3FB950" stroke-width="0.5" opacity="0.7"/>
    <line x1="-3.6" y1="-3.2" x2="0" y2="0" stroke="#F0883E" stroke-width="0.5" opacity="0.6"/>
    <line x1="4" y1="-5" x2="0" y2="0" stroke="#F0883E" stroke-width="0.5" opacity="0.6"/>
    <line x1="5.8" y1="2.7" x2="0" y2="0" stroke="#F0883E" stroke-width="0.5" opacity="0.6"/>
    <line x1="-5" y1="4" x2="0" y2="0" stroke="#F0883E" stroke-width="0.5" opacity="0.6"/>
  </g>

  <!-- 文字 LiangのWeb -->
  <text x="27" y="19.5" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#E6EDF3" letter-spacing="0.2">LiangのWeb</text>
</svg>